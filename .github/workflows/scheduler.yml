name: Claude 5-Hour Window Scheduler

on:
  schedule:
    - cron: '0 3 * * *'   # 06:00 MSK
    - cron: '0 8 * * *'   # 11:00 MSK
    - cron: '0 13 * * *'  # 16:00 MSK
  workflow_dispatch:       # можно запустить вручную

jobs:
  activate-window:
    runs-on: ubuntu-latest
    steps:
      - name: Activate 5-hour window
        run: |
          echo "Window activated at $(date)"
          echo "Time to open Claude and work!"
